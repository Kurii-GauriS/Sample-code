<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Disc Player</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            color: rgb(121, 223, 246);
            /* Background image settings */
            background: url('https://i.pinimg.com/1200x/a3/88/2a/a3882a2ffd771c65bb8b8fdfe27af2db.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Semi-transparent overlay for readability */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.422);
            z-index: -1;
        }

        /* Grid Container for 4x4 layout */
.song-container {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: smooth;
    scroll-snap-type: x mandatory;

    gap: 40px;
    padding: 50px;
    max-width: 1500px;
    margin: 0 auto;

    scrollbar-width: none;
    -ms-overflow-style: none;
}

.song-container::-webkit-scrollbar {
    display: none;
}

.music-card {
    flex: 0 0 calc((100% - 120px) / 4);
    min-width: 0;
    box-sizing: border-box;

    scroll-snap-align: start;

    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;

    border-radius: 35px;
    background: rgba(255, 255, 255, .08);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, .2);
    box-shadow: 0 15px 35px rgba(0, 0, 0, .4);

    opacity: 0;
    transform: translateY(80px);
    transition: opacity 0.7s, transform 0.7s, box-shadow 0.4s;
}

@media (max-width: 1100px) {
    .music-card {
        flex: 0 0 calc((100% - 40px) / 2);
    }
}

@media (max-width: 600px) {
    .song-container {
        padding: 30px 20px;
        gap: 20px;
    }

    .music-card {
        flex: 0 0 85%;
    }
}
        .music-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .music-card:hover {
            box-shadow: 0 20px 45px rgba(0, 0, 0, .6);
        }

        .music-info {
            width: 100%;
            text-align: center;
        }

        .music-info h1 {
            color: rgb(239, 187, 114);
            font-size: 30px;
            margin-bottom: 5px;
        }

        .music-info p {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .music-info audio {
            width: 90%;
        }

        .disc {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #000000 10%, rgb(164, 0, 0) 13%, black 70%);
            border: 6px solid #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            box-shadow: 0 0 20px red;
            transition: box-shadow .4s ease, transform .4s ease;
        }

        .disc:hover {
            box-shadow: 0 0 15px red, 0 0 35px red, 0 0 60px rgba(255, 0, 0, .7);
            transform: scale(1.05);
            cursor: pointer;
        }

        .spin {
            animation: rotate 3s linear infinite, glow 1.5s ease-in-out infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px red; }
            50% {
                box-shadow: 0 0 20px red, 0 0 45px red, 0 0 70px rgba(255, 0, 0, .8);
            }
        }

        .polaroid {
            width: 200px;
            background: #ffffffc2;
            padding: 10px 10px 40px;
            position: relative;
            transform: rotate(-6deg);
            box-shadow: 0 10px 25px rgba(0, 0, 0, .45);
            transition: transform 0.4s, box-shadow 0.4s;
        }

        .polaroid img {
            width: 100%;
            display: block;
        }

        .polaroid span {
            display: block;
            margin-top: 15px;
            text-align: center;
            font-size: 22px;
            font-family: cursive;
            color: #000;
        }

        .polaroid:hover {
            transform: rotate(-2deg) translateY(-12px) scale(1.05);
            box-shadow: 0 25px 40px rgba(0, 0, 0, .5);
        }

        .tape {
            width: 80px;
            height: 25px;
            background: #9a4242;
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%) rotate(3deg);
            transition: .4s;
            opacity: 0.8;
        }

        .polaroid:hover .tape {
            transform: translateX(-50%) rotate(-4deg);
        }

    .page-title {
    color: rgb(153, 48, 48);
    font-size: 45px;
    text-shadow:
        0 0 5px white,
        0 0 10px #1f2628,
        0 0 20px #00c8ff,
        0 0 35px #ff003c,
        0 0 60px #ff003c;
    animation: neonTitle 2s ease-in-out infinite alternate;
}

@keyframes neonTitle {
    from {
        text-shadow:
            0 0 5px white,
            0 0 10px #222627,
            0 0 20px #00c8ff,
            0 0 30px #ff003c;
    }

    to {
        text-shadow:
            0 0 10px white,
            0 0 20px #121213,
            0 0 35px #00c8ff,
            0 0 50px #ff003c,
            0 0 80px #ff003c;
    }
}
.search-box {
    display: flex;
    justify-content: center;
    margin: 25px auto 10px;
}

.search-box input {
    width: 420px;
    max-width: 80%;
    padding: 15px 22px;

    border: 2px solid rgba(0, 200, 255, 0.6);
    border-radius: 30px;

    background: rgba(0, 0, 0, 0.55);
    color: white;

    font-size: 17px;
    outline: none;

    backdrop-filter: blur(10px);
    box-shadow: 0 0 15px rgba(0, 200, 255, 0.35);

    transition: 0.3s;
}

.search-box input:focus {
    box-shadow:
        0 0 15px #00c8ff,
        0 0 35px rgba(255, 0, 60, 0.5);

    border-color: #ff003c;
}

.search-box input::placeholder {
    color: rgba(255, 255, 255, 0.7);
}
    </style>

        const container = document.getElementById("song-container");
        const searchInput = document.getElementById("searchInput");

        let filteredSongs = [...songs];

        function getCardsPerPage() {
            if (window.innerWidth <= 600) return 1;
            if (window.innerWidth <= 1100) return 2;
            return 4;
        }

        function renderSongs(songList) {
            // Stop any currently playing audio before rebuilding the list.
            document.querySelectorAll("audio").forEach(audio => audio.pause());

            container.innerHTML = "";

            songList.forEach((song) => {
                const encodedAudio = encodeURI(song.audio);

                container.insertAdjacentHTML("beforeend", `
                    <div class="music-card">
                        <div class="music-info">
                            <h1><i>${song.title}</i></h1>
                            <p><b>${song.artist}</b></p>

                            <audio controls preload="none">
                                <source src="${encodedAudio}" type="audio/mpeg">
                                Your browser does not support the audio element.
                            </audio>
                        </div>

                        <div class="disc">💿</div>

                        <div class="polaroid">
                            <div class="tape"></div>
                            <img src="${song.image}" alt="${song.title}">
                            <span>${song.artist}</span>
                        </div>
                    </div>
                `);
            });

            setupPlayers();
            setupRevealAnimation();
            scrollToPage(0, false);
        }

        function setupPlayers() {
            const cards = container.querySelectorAll(".music-card");
            const audios = container.querySelectorAll("audio");
            const discs = container.querySelectorAll(".disc");

            audios.forEach((audio, index) => {

                audio.addEventListener("play", () => {
                    audios.forEach((otherAudio, otherIndex) => {
                        if (otherIndex !== index) {
                            otherAudio.pause();
                            discs[otherIndex].classList.remove("spin");
                        }
                    });

                    discs[index].classList.add("spin");
                });

                audio.addEventListener("pause", () => {
                    discs[index].classList.remove("spin");
                });

                audio.addEventListener("ended", () => {
                    discs[index].classList.remove("spin");

                    const nextIndex = index + 1;

                    if (nextIndex < audios.length) {
                        // When the next song starts a new group of 4,
                        // automatically slide to that group.
                        if (nextIndex % getCardsPerPage() === 0) {
                            scrollToPage(
                                Math.floor(nextIndex / getCardsPerPage()),
                                true
                            );
                        }

                        audios[nextIndex].play().catch(() => {});
                    } else if (audios.length > 0) {
                        // Loop back to the first filtered song.
                        scrollToPage(0, true);
                        audios[0].play().catch(() => {});
                    }
                });
            });
        }

        function scrollToPage(page, smooth = true) {
            const cards = container.querySelectorAll(".music-card");

            if (!cards.length) return;

            const cardsPerPage = getCardsPerPage();
            const targetIndex = page * cardsPerPage;

            if (targetIndex >= cards.length) return;

            const targetCard = cards[targetIndex];

            container.scrollTo({
                left: Math.max(0, targetCard.offsetLeft - 20),
                behavior: smooth ? "smooth" : "auto"
            });
        }

        // Search by song title OR artist.
        searchInput.addEventListener("input", () => {
            const searchText = searchInput.value.toLowerCase().trim();

            filteredSongs = songs.filter(song =>
                song.title.toLowerCase().includes(searchText) ||
                song.artist.toLowerCase().includes(searchText)
            );

            renderSongs(filteredSongs);
        });

        // Optional manual navigation: mouse wheel over the music area
        // moves horizontally instead of vertically.
        container.addEventListener("wheel", (event) => {
            if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
                event.preventDefault();
                container.scrollLeft += event.deltaY;
            }
        }, { passive: false });

        function setupRevealAnimation() {
            const cards = container.querySelectorAll(".music-card");

            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("show");
                    }
                });
            }, { threshold: 0.1 });

            cards.forEach(card => observer.observe(card));
        }

        // Recalculate the layout after changing between desktop/tablet/mobile.
        window.addEventListener("resize", () => {
            scrollToPage(0, false);
